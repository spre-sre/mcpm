# Crucible config for mcpm (Go archetype). Pinned: changes need a human repin.
[project]
name = "mcpm"
runtime = "go"                # informational only

[gate]
source_paths = ["cmd/", "internal/", "main.go"]
trusted_paths = [
  "contracts/",
  "harness/",
  "harness/telemetry_driver/",     # the Tier 2 driver (main.go): named in driver_paths
  "cmd/gate-ast/",                 # the AST gate: more specific than the cmd/ source path, so pinned
  "go.mod",
  "go.sum",
  "go.work",
  "go.work.sum",
  "vendor/",
  ".gitignore",                     # decides which files closure treats as environment
  ".crucible/config.toml",
  ".crucible/baseline.json",
]
# Git-ignored paths a human admits at repin (kit 2.1.0, architecture.md 17).
# settings.local.json enables the crucible MCP server in Claude Code; .mcp.json
# starts it; .crucible/tasks/ is a worker tool's state. No gate command loads them.
ignored_allow = [".claude/settings.local.json", ".mcp.json", ".crucible/tasks/**"]

[ast]
# The Go archetype gate (architecture.md section 14): McCabe <= 10 per function,
# with the pinned .crucible/baseline.json ratchet for pre-adoption code. main.go
# is not an argument: a source file named in argv breaks command closure.
command = ["go", "run", "./cmd/gate-ast", "-json", "-limit", "10", "./internal", "./cmd"]
none_reason = ""
# GOENV=off: Go does not read its `go env -w` file (CC, CGO_*, GOFLAGS, GOMODCACHE ...) (kit 3.1.0, G7).
env = {GOWORK = "off", GOFLAGS = "-mod=readonly", GOTOOLCHAIN = "local", GOPROXY = "off", GOENV = "off"}

# .gitignore ignores go.work, and an ignored workspace file changes which code
# `go` loads. GOWORK=off in every command disables it; the digests below also
# refuse a go.work that appears after the pin. GOTOOLCHAIN=local stops `go`
# from downloading a different toolchain.
[environment]
digest_globs = ["go.work", "go.work.sum"]
# Kit 3.1.0 (G3): gate commands get only the base allowlist (PATH, HOME, TMPDIR, LANG, ...).
# mcpm needs nothing more: the Go caches default to directories under HOME.
pass = []

[tier1]
# Only the harness package, only the contract tests: a test file elsewhere
# would run with CRUCIBLE_RESULTS in its environment.
# harness/run_tier1.sh runs the cmd/ and internal/ unit tests without the
# CRUCIBLE_RESULTS* variables, then the contract tests with them.
command = ["./harness/run_tier1.sh"]
# Kit 3.1.0 (G8): fails Tier 1 when a module in the cache differs from go.sum.
before = [["go", "mod", "verify"]]
contract_tests = ["harness/crucible_contracts_test.go"]
timeout_seconds = 900
# A source change that reaches a Node, Python or Go build must not use the
# network. Modules come from the cache (`[ci] setup` fills it on a runner).
env = {GOWORK = "off", GOFLAGS = "-mod=readonly", GOTOOLCHAIN = "local", GOPROXY = "off", GOENV = "off", NPM_CONFIG_OFFLINE = "true", PIP_NO_INDEX = "1"}

[tier2]
# A .go file argument needs no ./ prefix; the driver is pinned through driver_paths.
command = ["go", "run", "harness/telemetry_driver/main.go"]
driver_paths = ["harness/telemetry_driver/"]
env = {GOWORK = "off", GOFLAGS = "-mod=readonly", GOTOOLCHAIN = "local", GOPROXY = "off", GOENV = "off"}
samples = 5000
rounds = 10
p99_drift_max = 0.02
p50_drift_max = 0.02
bootstrap_samples = 1000
ci_level = 0.95
leak_slope_max = 1024.0
leak_alpha = 0.05
min_samples = 1000
timeout_seconds = 1800

# Runs in `bin/crucible ci` only, before Tier 1. Pinned with this file.
[ci]
setup = [["go", "mod", "download"]]
env = {GOWORK = "off", GOFLAGS = "-mod=readonly", GOTOOLCHAIN = "local", GOENV = "off"}

[mutation]
mutants = [
  "contracts/mutants/INV_PROJECT_DETECTED-go-sum-detected.patch",
  "contracts/mutants/INV_MANIFEST_JSON-runcmd-check-removed.patch",
  "contracts/mutants/INV_SERVER_INSTALLED-notexist-check-removed.patch",
  "contracts/mutants/INV_HOST_PORT_SPLIT-keep-colon.patch",
  "contracts/mutants/INV_HOST_WITHOUT_PORT-multi-colon-check-removed.patch",
]

[attestation]
ttl_seconds = 3600
